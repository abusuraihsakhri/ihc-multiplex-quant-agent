[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ihc-multiplex-quant-engine"
version = "2.0.0"
description = "IHC-Multiplex Quant: Autonomous Multiplex Immunofluorescence & Cell Phenotyping Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ihc-multiplex-quant-engine = "ihc_multiplex_quant_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ihc-multiplex-quant-agent"
Repository = "https://github.com/abusuraihsakhri/ihc-multiplex-quant-engine.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "ihc_multiplex", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "ihc_multiplex_quant_agent*"]
